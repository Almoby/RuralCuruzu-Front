<app-modal [open]="open()" [title]="title()" size="lg" (close)="onClose()">
  <form class="merchant-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="merchant-form__grid">
      <app-input
        label="Nombre comercial"
        placeholder="Nombre comercial"
        formControlName="tradeName"
        [error]="fieldError('tradeName')"
      />
      <app-input
        label="Razón social"
        placeholder="Razón social"
        formControlName="name"
        [error]="fieldError('name')"
      />
      <app-input
        label="CUIT"
        placeholder="30-00000000-0"
        formControlName="cuit"
        [maxLength]="cuitMaxLength"
        [error]="fieldError('cuit')"
      />
      <app-select
        label="Rubro"
        formControlName="category"
        [options]="categoryOptions()"
        [error]="fieldError('category')"
      />
      <app-input
        label="Teléfono"
        type="tel"
        placeholder="+54 11..."
        formControlName="phone"
        [error]="fieldError('phone')"
      />
      <app-input
        label="Email"
        type="email"
        placeholder="correo@email.com"
        formControlName="email"
        [error]="fieldError('email')"
      />
    </div>

    <app-input
      label="Dirección"
      placeholder="Calle, número, ciudad"
      formControlName="address"
      [error]="fieldError('address')"
    />
  </form>

  <div modalFooter class="merchant-form__footer">
    <button type="button" class="merchant-form__cancel" (click)="onClose()">Cancelar</button>
    <app-button variant="primary" [disabled]="submitting()" [fullWidth]="true" (click)="onSubmit()">
      {{ submitLabel() }}
    </app-button>
  </div>
</app-modal>
