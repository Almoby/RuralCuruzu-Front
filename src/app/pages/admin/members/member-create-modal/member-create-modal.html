<app-modal [open]="open()" title="Nuevo Socio" size="lg" (close)="onClose()">
  <form class="member-create" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="member-create__grid">
      <app-select
        label="Tipo de persona"
        formControlName="personType"
        [options]="personTypeOptions"
        [error]="fieldError('personType')"
      />
      <app-select
        label="Categoría"
        formControlName="category"
        [options]="categoryOptions"
        [error]="fieldError('category')"
      />
    </div>

    <app-input
      [label]="isJuridica() ? 'Razón social' : 'Apellido y nombre'"
      placeholder="Apellido y nombre / Razón social"
      formControlName="fullName"
      [error]="fieldError('fullName')"
    />

    <div class="member-create__grid">
      @if (isFisica()) {
        <app-input
          label="DNI"
          placeholder="00.000.000"
          formControlName="documentNumber"
          [error]="fieldError('documentNumber')"
        />
        <app-input
          label="Fecha de Nacimiento"
          type="date"
          formControlName="birthDate"
          [error]="fieldError('birthDate')"
        />
      }
      <app-input
        label="CUIT / CUIL"
        placeholder="20-00000000-0"
        formControlName="cuit"
        [error]="fieldError('cuit')"
      />
      <app-input
        label="Email"
        type="email"
        placeholder="correo@email.com"
        formControlName="email"
        [error]="fieldError('email')"
      />
      <app-input
        label="Teléfono"
        type="tel"
        placeholder="+54 9 11..."
        formControlName="phone"
        [error]="fieldError('phone')"
      />
    </div>

    <app-input
      label="Dirección"
      placeholder="Calle, número, ciudad"
      formControlName="address"
      [error]="fieldError('address')"
    />

    <app-input
      label="Portal / Piso / Depto (opcional)"
      placeholder="Depto B"
      formControlName="portalFloor"
      [error]="fieldError('portalFloor')"
    />

    <div class="member-create__grid">
      <app-input
        label="Establecimiento (opcional)"
        placeholder="Nombre del establecimiento"
        formControlName="establishmentName"
        [error]="fieldError('establishmentName')"
      />
      <app-input
        label="Dirección del establecimiento (opcional)"
        placeholder="Dirección del establecimiento"
        formControlName="establishmentAddress"
        [error]="fieldError('establishmentAddress')"
      />
    </div>

    @if (isJuridica()) {
      <div class="member-create__grid">
        <app-input
          label="Nombre del responsable"
          placeholder="Nombre y apellido"
          formControlName="responsableName"
          [error]="fieldError('responsableName')"
        />
        <app-input
          label="DNI del responsable"
          placeholder="00.000.000"
          formControlName="responsableDocument"
          [error]="fieldError('responsableDocument')"
        />
      </div>
    }

    <app-select
      label="Estado inicial"
      formControlName="membershipStatus"
      [options]="statusOptions"
      [error]="fieldError('membershipStatus')"
    />
  </form>

  <div modalFooter class="member-create__footer">
    <button type="button" class="member-create__cancel" (click)="onClose()">Cancelar</button>
    <app-button variant="primary" [disabled]="submitting()" [fullWidth]="true" (click)="onSubmit()">
      Crear socio
    </app-button>
  </div>
</app-modal>
