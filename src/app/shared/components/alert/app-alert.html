@if (visible()) {
  <div
    class="app-alert"
    role="alert"
    [class.app-alert--success]="variant() === 'success'"
    [class.app-alert--error]="variant() === 'error'"
    [class.app-alert--warning]="variant() === 'warning'"
    [class.app-alert--info]="variant() === 'info'"
  >
    <p class="app-alert__message">{{ message() }}</p>

    @if (dismissible()) {
      <button class="app-alert__dismiss" type="button" aria-label="Cerrar alerta" (click)="dismiss()">
        ×
      </button>
    }
  </div>
}
