<div class="app-search" [class.app-search--disabled]="disabled()">
  <span class="app-search__icon" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
  </span>

  <input
    class="app-search__field"
    type="search"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="searchTerm()"
    (input)="onInput($event)"
  />

  @if (searchTerm()) {
    <button class="app-search__clear" type="button" aria-label="Limpiar búsqueda" (click)="clear()">
      ×
    </button>
  }
</div>
