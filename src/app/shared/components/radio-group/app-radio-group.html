<fieldset class="app-radio-group" [disabled]="isDisabled" [class.app-radio-group--error]="!!error()">
  @if (label()) {
    <legend class="app-radio-group__legend">{{ label() }}</legend>
  }

  <div class="app-radio-group__options" role="radiogroup">
    @for (option of options(); track option.value) {
      <label class="app-radio-group__option">
        <input
          class="app-radio-group__input"
          type="radio"
          [name]="name()"
          [value]="option.value"
          [checked]="value() === option.value"
          [disabled]="isDisabled"
          (change)="onSelect(option.value)"
        />
        <span class="app-radio-group__control" aria-hidden="true"></span>
        <span class="app-radio-group__label">{{ option.label }}</span>
      </label>
    }
  </div>

  @if (error()) {
    <p class="app-radio-group__error">{{ error() }}</p>
  }
</fieldset>
