@if (open()) {
  <div class="app-modal" role="presentation" (click)="onBackdropClick()">
    <div
      class="app-modal__dialog"
      [class.app-modal__dialog--md]="size() === 'md'"
      [class.app-modal__dialog--lg]="size() === 'lg'"
      [class.app-modal__dialog--xl]="size() === 'xl'"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || null"
      (click)="onDialogClick($event)"
    >
      <header class="app-modal__header">
        <div class="app-modal__heading">
          @if (title()) {
            <h2 class="app-modal__title">{{ title() }}</h2>
          }
          @if (subtitle()) {
            <p class="app-modal__subtitle">{{ subtitle() }}</p>
          }
        </div>
        <button
          class="app-modal__close"
          type="button"
          aria-label="Cerrar"
          [disabled]="closeDisabled()"
          (click)="onCloseClick()"
        >
          ×
        </button>
      </header>

      <div class="app-modal__body">
        <ng-content />
      </div>

      <footer class="app-modal__footer">
        <ng-content select="[modalFooter]" />
      </footer>
    </div>
  </div>
}
